AWSTemplateFormatVersion: '2010-09-09'
Description: AWS City - a private S3 bucket for your holiday photos (public access blocked, encrypted, versioned).

Resources:
  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: managed-by
          Value: aws-city

Outputs:
  BucketName:
    Description: The bucket that keeps your photos
    Value: !Ref PhotoBucket
