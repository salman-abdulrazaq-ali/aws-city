name: release
# Tag v1.2.3 → production extension zips on the GitHub release: Chrome Web Store (also Edge Add-ons) and
# Firefox Add-ons (with the sources zip AMO asks for). Safari ships through Xcode (docs/safari.md).
# Built with a read-only token and no saved git credentials; only the publish job (no npm, no build) can write.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - name: The tag is package.json's version
        run: node scripts/release-check.mjs --tag "$GITHUB_REF_NAME"
      - run: npm ci && npm run check
      # wxt.config.ts fails this step if a WXT_* variable is missing (a store build never falls back to the demo).
      - name: Build against the hosted backend
        run: npm run zip && npm run zip:firefox
        env:
          WXT_BACKEND: hosted
          WXT_STORE_BUILD: 'true'
          WXT_AWS_WS_URL: ${{ vars.WXT_AWS_WS_URL }}
          WXT_AWS_API_URL: ${{ vars.WXT_AWS_API_URL }}
          WXT_COGNITO_DOMAIN: ${{ vars.WXT_COGNITO_DOMAIN }}
          WXT_COGNITO_CLIENT_ID: ${{ vars.WXT_COGNITO_CLIENT_ID }}
          # The privacy policy's https address (⋯ → Account, the sign-in card); the stores require one.
          WXT_PRIVACY_URL: ${{ vars.WXT_PRIVACY_URL }}
      - name: The built manifests carry that version and no key
        run: node scripts/release-check.mjs --tag "$GITHUB_REF_NAME" .output/chrome-mv3/manifest.json .output/firefox-mv3/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zips
          path: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The prod environment's reviewers approve the release (its deployment rule must allow v* tags; docs/runbook.md).
    environment: prod
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: zips, path: zips }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: zips/*.zip
